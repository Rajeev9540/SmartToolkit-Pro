<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartToolkit Pro - All-in-One Cyberpunk Web Suite</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- External JS Libraries for Conversion, Zip & PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- React, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      overflow-x: hidden;
    }

    /* Glassmorphic UI Tokens */
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(0, 243, 255, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(0, 243, 255, 0.15);
    }

    .glow-cyan {
      background: #06b6d4;
      color: #030712;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
      transition: all 0.3s ease;
    }

    .glow-cyan:hover {
      background: #22d3ee;
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.7);
    }

    .glow-pink {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }

    .glow-pink:hover {
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Particle Background -->
  <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <div id="root" class="relative z-10 flex-grow flex flex-col"></div>

  <!-- React Logic -->
  <script type="text/babel">
    // FIX: Fallback worker for local file system (C:/Users/.../Index.HTML) execution
    try {
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    } catch(err) {
      console.warn("PDF Worker initialization issue: ", err);
    }

    const { useState, useEffect } = React;

    const ALL_TOOLS = [
      { id: 'pdf-converter', name: 'File Converter Engine', category: 'PDF & Media', desc: 'Convert PDF to Ultra HD JPG or combine Images into PDF.', badge: 'Pro Suite' },
      { id: 'word-counter', name: 'Word & Character Counter', category: 'Text', desc: 'Real-time sentence, word, character, and reading time analytics.', badge: 'Fast' },
      { id: 'case-converter', name: 'Case Converter', category: 'Text', desc: 'Convert text to UPPERCASE, lowercase, Title Case, and CamelCase.' },
      { id: 'json-formatter', name: 'JSON Formatter & Validator', category: 'Developer', desc: 'Prettify, format, and validate complex JSON strings.', badge: 'Popular' },
      { id: 'base64-tool', name: 'Base64 Encoder/Decoder', category: 'Developer', desc: 'Encode plain text to Base64 or decode Base64 back to text.' },
      { id: 'uuid-generator', name: 'UUID v4 Generator', category: 'Developer', desc: 'Generate RFC4122 compliant unique UUID keys.' },
      { id: 'emi-calculator', name: 'Loan EMI Calculator', category: 'Calculators', desc: 'Calculate monthly EMI, total interest, and overall loan cost.', badge: 'Finance' },
      { id: 'gst-calculator', name: 'GST / Tax Calculator', category: 'Calculators', desc: 'Add or remove GST tax percentage with cost breakdown.' },
      { id: 'ai-email-writer', name: 'AI Email Draft Assistant', category: 'AI Tools', desc: 'Generate professional work emails based on prompts.', badge: 'AI' }
    ];

    function App() {
      const [selectedTool, setSelectedTool] = useState('pdf-converter');
      const [category, setCategory] = useState('All');
      const [search, setSearch] = useState('');

      // Utility Tool States
      const [inputVal, setInputVal] = useState('');
      const [outputVal, setOutputVal] = useState('');
      const [copied, setCopied] = useState(false);

      // Financial States
      const [loanAmount, setLoanAmount] = useState(500000);
      const [interestRate, setInterestRate] = useState(8.5);
      const [tenureYears, setTenureYears] = useState(5);
      const [gstAmount, setGstAmount] = useState(10000);
      const [gstRate, setGstRate] = useState(18);

      // File Converter States
      const [convMode, setConvMode] = useState('pdf2jpg');
      const [fileQueue, setFileQueue] = useState([]);
      const [isConverting, setIsConverting] = useState(false);
      const [progress, setProgress] = useState(0);
      const [statusMsg, setStatusMsg] = useState('Select or drop files to convert.');
      const [renderedCards, setRenderedCards] = useState([]);
      const [processedResults, setProcessedResults] = useState([]);
      const [createdPdfBlob, setCreatedPdfBlob] = useState(null);

      // --- Utility Functions ---
      const runTextTool = () => {
        switch (selectedTool) {
          case 'word-counter': {
            const words = inputVal.trim() ? inputVal.trim().split(/\s+/).length : 0;
            const chars = inputVal.length;
            const lines = inputVal ? inputVal.split('\n').length : 0;
            setOutputVal(`📊 Analytics Result:\n• Words: ${words}\n• Characters: ${chars}\n• Paragraphs: ${lines}\n• Est. Reading Time: ${Math.ceil(words / 200)} min`);
            break;
          }
          case 'case-converter': {
            setOutputVal(`UPPERCASE:\n${inputVal.toUpperCase()}\n\nlowercase:\n${inputVal.toLowerCase()}\n\nTitle Case:\n${inputVal.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase())}`);
            break;
          }
          case 'json-formatter': {
            try {
              const parsed = JSON.parse(inputVal);
              setOutputVal(JSON.stringify(parsed, null, 2));
            } catch (err) {
              setOutputVal(`❌ Invalid JSON:\n${err.message}`);
            }
            break;
          }
          case 'base64-tool': {
            try {
              setOutputVal(`Encoded Base64:\n${btoa(inputVal)}`);
            } catch (e) {
              setOutputVal('Error processing Base64.');
            }
            break;
          }
          case 'uuid-generator': {
            const uuids = Array.from({ length: 5 }, () => crypto.randomUUID()).join('\n');
            setOutputVal(`Generated Unique UUIDs:\n${uuids}`);
            break;
          }
          case 'ai-email-writer': {
            setOutputVal(`Subject: Update regarding ${inputVal || 'project status'}\n\nDear Team,\n\nI am writing to share a brief update on ${inputVal || 'our current milestones'}. Everything is on track.\n\nPlease let me know if you have any questions.\n\nBest regards,\nSmartToolkit User`);
            break;
          }
          default:
            setOutputVal(inputVal);
        }
      };

      const calculateEMI = () => {
        const r = interestRate / 12 / 100;
        const n = tenureYears * 12;
        const emi = (loanAmount * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        const totalPayable = emi * n;
        const totalInterest = totalPayable - loanAmount;
        setOutputVal(`💰 Loan Summary:\n• Monthly EMI: ₹${emi.toFixed(2)}\n• Total Interest: ₹${totalInterest.toFixed(2)}\n• Total Amount Payable: ₹${totalPayable.toFixed(2)}`);
      };

      const calculateGST = () => {
        const gstVal = (gstAmount * gstRate) / 100;
        const totalWithGst = gstAmount + gstVal;
        setOutputVal(`🏷️ Tax Summary:\n• Base Price: ₹${gstAmount}\n• GST Amount (${gstRate}%): ₹${gstVal.toFixed(2)}\n• Gross Total: ₹${totalWithGst.toFixed(2)}`);
      };

      // --- File Converter Logic ---
      const handleFileSelection = (e) => {
        const files = Array.from(e.target.files || []);
        const filtered = convMode === 'pdf2jpg' 
          ? files.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'))
          : files.filter(f => f.type.startsWith('image/'));
        
        setFileQueue(filtered);
        setRenderedCards([]);
        setProcessedResults([]);
        setCreatedPdfBlob(null);
        setStatusMsg(`${filtered.length} file(s) loaded. Ready to convert.`);
      };

      const startFileConversion = async () => {
        if (!fileQueue.length) return;
        setIsConverting(true);
        setProgress(0);
        setRenderedCards([]);

        try {
          if (convMode === 'pdf2jpg') {
            let totalPages = 0, globalCounter = 0, parsedPdfs = [];
            
            for (let file of fileQueue) {
              const buffer = await file.arrayBuffer();
              const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(buffer), disableWorker: true });
              const pdfDoc = await loadingTask.promise;
              totalPages += pdfDoc.numPages;
              parsedPdfs.push({ name: file.name, pdfDoc });
            }

            let resultsArr = [];
            let cardsArr = [];

            for (let i = 0; i < parsedPdfs.length; i++) {
              const { name, pdfDoc } = parsedPdfs[i];
              const cleanName = name.replace(/\.[^/.]+$/, "");
              let fileImages = [];

              for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                globalCounter++;
                setProgress(Math.round((globalCounter / totalPages) * 100));
                setStatusMsg(`Rendering Page ${pageNum}/${pdfDoc.numPages} of ${name}`);

                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: ctx, viewport }).promise;
                const jpgData = canvas.toDataURL('image/jpeg', 0.9);
                const imgName = `${cleanName}_page_${pageNum}.jpg`;

                fileImages.push({ name: imgName, data: jpgData.split(',')[1] });
                cardsArr.push({ id: `${cleanName}-${pageNum}`, name: imgName, url: jpgData });
              }
              resultsArr.push({ folderName: cleanName, images: fileImages });
            }
            setProcessedResults(resultsArr);
            setRenderedCards(cardsArr);
            setStatusMsg('✨ Conversion Complete!');
          } else {
            // Image to PDF Mode
            const { jsPDF } = window.jspdf;
            let pdf = null;
            let cardsArr = [];

            for (let i = 0; i < fileQueue.length; i++) {
              const file = fileQueue[i];
              setProgress(Math.round(((i + 1) / fileQueue.length) * 100));
              setStatusMsg(`Adding image ${i + 1}/${fileQueue.length}`);

              const dataUrl = await new Promise((res) => {
                const r = new FileReader();
                r.onload = e => res(e.target.result);
                r.readAsDataURL(file);
              });

              const imgProps = await new Promise((res) => {
                const img = new Image();
                img.onload = () => res({ width: img.width, height: img.height });
                img.src = dataUrl;
              });

              const orientation = imgProps.width > imgProps.height ? 'l' : 'p';
              if (i === 0) pdf = new jsPDF({ orientation, unit: 'px', format: [imgProps.width, imgProps.height] });
              else pdf.addPage([imgProps.width, imgProps.height], orientation);

              pdf.addImage(dataUrl, 'JPEG', 0, 0, imgProps.width, imgProps.height);
              cardsArr.push({ id: `img-${i}`, name: file.name, url: dataUrl });
            }

            setCreatedPdfBlob(pdf.output('blob'));
            setRenderedCards(cardsArr);
            setStatusMsg('✨ PDF Created Successfully!');
          }
        } catch (error) {
          console.error(error);
          setStatusMsg(`❌ Error during conversion: ${error.message}`);
        }
        setIsConverting(false);
      };

      const downloadMasterZip = () => {
        const zip = new JSZip();
        processedResults.forEach(res => {
          const folder = zip.folder(res.folderName);
          res.images.forEach(img => folder.file(img.name, img.data, { base64: true }));
        });
        zip.generateAsync({ type: 'blob' }).then(content => saveAs(content, 'Converted_Images.zip'));
      };

      const downloadSinglePdf = () => {
        if (createdPdfBlob) saveAs(createdPdfBlob, 'Combined_Document.pdf');
      };

      const filteredTools = ALL_TOOLS.filter(t => {
        const matchesSearch = t.name.toLowerCase().includes(search.toLowerCase()) || t.desc.toLowerCase().includes(search.toLowerCase());
        const matchesCategory = category === 'All' || t.category === category;
        return matchesSearch && matchesCategory;
      });

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="sticky top-0 z-50 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-purple-600 to-pink-500 p-[1px]">
                  <div className="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center font-extrabold text-cyan-400">
                    ⚡
                  </div>
                </div>
                <span className="text-2xl font-black text-white tracking-tight">
                  Smart<span className="text-cyan-400">Toolkit</span> Pro
                </span>
              </div>
              <span className="text-xs px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-bold">
                Merged Suite Edition
              </span>
            </div>
          </header>

          {/* Hero */}
          <section className="pt-12 pb-8 px-6 text-center max-w-4xl mx-auto">
            <h1 className="text-4xl sm:text-6xl font-black bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent leading-tight">
              One Workspace. <br />
              <span className="bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-transparent">
                Every Powerful Tool.
              </span>
            </h1>
            <p className="mt-3 text-slate-400 text-sm sm:text-base">
              Convert PDFs & images, calculate loan EMIs, encode Base64, and run developer tools directly in your browser.
            </p>

            {/* Search */}
            <div className="mt-6 max-w-lg mx-auto">
              <input
                type="text"
                placeholder="Search any tool (e.g., Converter, JSON, EMI)..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl py-3 px-5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"
              />
            </div>
          </section>

          {/* Active Tool Playground */}
          <main className="max-w-5xl mx-auto px-6 w-full mb-16">
            <div className="glass-panel p-6 sm:p-8 rounded-3xl mb-10">
              <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
                  <h2 className="text-xl font-bold text-white">{selectedTool.replace('-', ' ').toUpperCase()}</h2>
                </div>
                <span className="text-xs text-slate-400 font-mono">Browser Native Engine</span>
              </div>

              {/* RENDER ACTIVE TOOL UI */}
              {selectedTool === 'pdf-converter' ? (
                <div className="space-y-6">
                  {/* Mode Selector */}
                  <div className="flex gap-3">
                    <button
                      onClick={() => { setConvMode('pdf2jpg'); setFileQueue([]); setRenderedCards([]); setStatusMsg('Select or drop files to convert.'); }}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                        convMode === 'pdf2jpg' ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'
                      }`}
                    >
                      📄 PDF to JPG
                    </button>
                    <button
                      onClick={() => { setConvMode('img2pdf'); setFileQueue([]); setRenderedCards([]); setStatusMsg('Select or drop files to convert.'); }}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                        convMode === 'img2pdf' ? 'bg-cyan-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'
                      }`}
                    >
                      🖼️ JPG / PNG to PDF
                    </button>
                  </div>

                  {/* Drop Zone */}
                  <label className="block border-2 border-dashed border-cyan-500/40 hover:border-cyan-400 bg-slate-900/60 rounded-2xl p-8 text-center cursor-pointer transition-all">
                    <span className="text-3xl block mb-2">🚀</span>
                    <span className="text-sm font-bold text-white block">
                      {convMode === 'pdf2jpg' ? 'Select PDF Files' : 'Select JPG or PNG Images'}
                    </span>
                    <span className="text-xs text-slate-400">Click or drag and drop files from your device</span>
                    <input
                      type="file"
                      onChange={handleFileSelection}
                      accept={convMode === 'pdf2jpg' ? 'application/pdf' : 'image/jpeg, image/png'}
                      multiple
                      className="hidden"
                    />
                  </label>

                  {/* Status & Action Bar */}
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <button
                      onClick={startFileConversion}
                      disabled={!fileQueue.length || isConverting}
                      className="px-6 py-3 rounded-xl font-bold glow-cyan disabled:opacity-40"
                    >
                      {isConverting ? 'Processing...' : '⚡ Convert Now'}
                    </button>

                    {processedResults.length > 0 && convMode === 'pdf2jpg' && (
                      <button onClick={downloadMasterZip} className="px-6 py-3 rounded-xl font-bold glow-pink">
                        📦 Download Master ZIP
                      </button>
                    )}

                    {createdPdfBlob && convMode === 'img2pdf' && (
                      <button onClick={downloadSinglePdf} className="px-6 py-3 rounded-xl font-bold glow-pink">
                        📄 Download Combined PDF
                      </button>
                    )}
                  </div>

                  {/* Progress Indicator */}
                  {(isConverting || statusMsg) && (
                    <div className="space-y-2">
                      {isConverting && (
                        <div className="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden">
                          <div className="bg-gradient-to-r from-cyan-400 to-pink-500 h-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                      )}
                      <span className="text-xs text-cyan-400 font-mono block">{statusMsg}</span>
                    </div>
                  )}

                  {/* Rendered Output Previews */}
                  {renderedCards.length > 0 && (
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
                      {renderedCards.map((card) => (
                        <div key={card.id} className="bg-slate-900 border border-slate-800 p-2 rounded-xl text-center">
                          <img src={card.url} className="w-full h-28 object-cover rounded-lg mb-2" />
                          <span className="text-[10px] text-slate-400 block truncate">{card.name}</span>
                          <a href={card.url} download={card.name} className="inline-block mt-1 text-[10px] text-cyan-400 font-bold hover:underline">
                            ⬇ Download
                          </a>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ) : selectedTool === 'emi-calculator' ? (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="text-xs text-slate-400">Loan Amount (₹)</label>
                      <input type="number" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Interest Rate (%)</label>
                      <input type="number" step="0.1" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Tenure (Years)</label>
                      <input type="number" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white text-sm" />
                    </div>
                  </div>
                  <button onClick={calculateEMI} className="w-full py-3 rounded-xl font-bold glow-cyan">Calculate EMI</button>
                </div>
              ) : selectedTool === 'gst-calculator' ? (
                <div className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs text-slate-400">Base Amount (₹)</label>
                      <input type="number" value={gstAmount} onChange={(e) => setGstAmount(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white text-sm" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">GST Rate (%)</label>
                      <input type="number" value={gstRate} onChange={(e) => setGstRate(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white text-sm" />
                    </div>
                  </div>
                  <button onClick={calculateGST} className="w-full py-3 rounded-xl font-bold glow-cyan">Calculate Tax</button>
                </div>
              ) : (
                <div className="space-y-4">
                  <textarea
                    rows={5}
                    value={inputVal}
                    onChange={(e) => setInputVal(e.target.value)}
                    placeholder="Enter input data or prompt..."
                    className="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl p-4 text-white text-sm font-mono focus:outline-none focus:border-cyan-400"
                  />
                  <button onClick={runTextTool} className="w-full py-3 rounded-xl font-bold glow-cyan">Run Utility</button>
                </div>
              )}

              {/* Utility Output */}
              {outputVal && selectedTool !== 'pdf-converter' && (
                <div className="mt-6 pt-4 border-t border-slate-800">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-slate-300">Result Output</span>
                    <button onClick={() => { navigator.clipboard.writeText(outputVal); setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="text-xs text-cyan-400 hover:underline">
                      {copied ? '✓ Copied' : '📋 Copy Output'}
                    </button>
                  </div>
                  <pre className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-emerald-400 font-mono text-sm overflow-x-auto whitespace-pre-wrap">{outputVal}</pre>
                </div>
              )}
            </div>

            {/* Category Filter */}
            <div className="flex items-center gap-2 overflow-x-auto pb-4 mb-6">
              {['All', 'PDF & Media', 'Text', 'Developer', 'Calculators', 'AI Tools'].map((cat) => (
                <button
                  key={cat}
                  onClick={() => setCategory(cat)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    category === cat ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-400 border border-slate-800'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* Tools Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {filteredTools.map((t) => (
                <div
                  key={t.id}
                  onClick={() => { setSelectedTool(t.id); setOutputVal(''); }}
                  className={`glass-card p-5 rounded-2xl cursor-pointer ${selectedTool === t.id ? 'border-cyan-400 bg-slate-900' : ''}`}
                >
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-[10px] font-mono text-slate-500 uppercase">{t.category}</span>
                    {t.badge && <span className="text-[10px] px-2 py-0.5 rounded-md bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-bold">{t.badge}</span>}
                  </div>
                  <h3 className="text-base font-bold text-white mb-1">{t.name}</h3>
                  <p className="text-xs text-slate-400">{t.desc}</p>
                </div>
              ))}
            </div>
          </main>

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
            SmartToolkit Pro © 2026. Merged Single-File Solution.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Particle Canvas Animation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 40 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 2,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      color: ['#06b6d4', '#a855f7', '#ec4899'][Math.floor(Math.random() * 3)]
    }));

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
